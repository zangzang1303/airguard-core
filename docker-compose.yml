services:
  postgres:
    image: postgres:16
    container_name: airguard-postgres
    environment:
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: airguard
      POSTGRES_DB: airguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airguard -d airguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: airguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: airguard-rabbitmq
    profiles: ["async-jobs"]
    environment:
      RABBITMQ_DEFAULT_USER: airguard
      RABBITMQ_DEFAULT_PASS: airguard
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airguard-redis
    profiles: ["async-jobs"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: airguard-backend
    environment:
      DATABASE_URL: postgresql://airguard:airguard@postgres:5432/airguard
      CORS_ORIGINS: http://localhost:5173,http://frontend:5173
      STALE_AFTER_SECONDS: 300
      PM25_WARNING_THRESHOLD: 50
      PM25_CRITICAL_THRESHOLD: 100
      PM25_ALERT_RULE_VERSION: pm25-threshold-v1
      PM25_ALERT_CONSECUTIVE_MEASUREMENTS: ${PM25_ALERT_CONSECUTIVE_MEASUREMENTS:-2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-memory://}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-true}
      JOB_PERSISTENCE_ENABLED: "true"
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_SERVICE_TIMEOUT_SECONDS: 8
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
    container_name: airguard-agent
    environment:
      APP_ENV: development
      APP_PORT: 8001
      AGENT_BACKEND_BASE_URL: http://backend:8000
      AGENT_TOOL_TIMEOUT_SECONDS: 3
      AGENT_TOOL_MAX_RETRIES: 1
      CORS_ORIGINS: http://localhost:5173
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: airguard-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
    container_name: airguard-sensor-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_QOS: 1
      SENSOR_INTERVAL_SECONDS: 10
      SENSOR_SCENARIO: ${SENSOR_SCENARIO:-normal}
      SENSOR_RANDOM_SEED: ${SENSOR_RANDOM_SEED:-740}
      SENSOR_RUN_ID: ${SENSOR_RUN_ID:-}
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - mqtt
    restart: unless-stopped


  mqtt-consumer:
    build:
      context: ./services/mqtt-consumer
    container_name: airguard-mqtt-consumer
    environment:
      DATABASE_URL: postgresql://airguard:airguard@postgres:5432/airguard
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_QOS: 1
      STALE_AFTER_SECONDS: 300
      MAX_FUTURE_SKEW_SECONDS: 60
      BACKEND_URL: http://backend:8000
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  device-simulator:
    build:
      context: ./services/device-simulator
    container_name: airguard-device-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_QOS: 1
      DEVICE_ID: FILTER-01
      DEVICE_STATE_PATH: /data/processed-keys.json
    volumes:
      - device_state:/data
    depends_on:
      - mqtt
    restart: unless-stopped


  celery-worker:
    build:
      context: ./backend
    container_name: airguard-celery-worker
    profiles: ["async-jobs"]
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql://airguard:airguard@postgres:5432/airguard
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      CELERY_BROKER_URL: amqp://airguard:airguard@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      JOB_PERSISTENCE_ENABLED: "true"
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_SERVICE_TIMEOUT_SECONDS: 8
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
      agent:
        condition: service_started

volumes:
  postgres_data:
  device_state:

