name: Deploy Azure demo

on:
  push:
    branches: [Canh]
  workflow_dispatch:

concurrency:
  group: airguard-azure-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'zangzang1303/airguard-core' || github.repository == 'AI20K-Build-Phase-Cohort-3/P-074'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: azure-demo
      url: https://airguard-074-app.indonesiacentral.cloudapp.azure.com
    env:
      AZURE_HOST: airguard-074-app.indonesiacentral.cloudapp.azure.com
      AZURE_USER: azureuser
      EXPECTED_HOST_FINGERPRINT: SHA256:D5MnGvRyv/ndemdd9poD3so3eil6F9kVQ03QYU6/iJE
      PUBLIC_READY_URL: https://airguard-074-app.indonesiacentral.cloudapp.azure.com/backend/ready

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate public Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only
          DEMO_DOMAIN: airguard-074-app.indonesiacentral.cloudapp.azure.com
        run: docker compose -f docker-compose.public-demo.yml config --quiet

      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.AZURE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          python3 -c "
          import os, sys
          key = os.environ.get('DEPLOY_KEY', '')
          if not key.strip():
              print('::error::AZURE_DEPLOY_SSH_KEY secret is empty!', file=sys.stderr)
              sys.exit(1)
          # Handle literal \n (if key was saved as single-line escaped string)
          if '\\\n' not in key and '\\n' in key and '\n' not in key.strip():
              key = key.replace('\\n', '\n')
          elif '\\n' in key and key.count('\n') < 3:
              key = key.replace('\\n', '\n')
          key = key.replace('\r', '')
          key = key.strip() + '\n'
          target = os.path.expanduser('~/.ssh/airguard_deploy')
          with open(target, 'w') as f:
              f.write(key)
          os.chmod(target, 0o600)
          "

          # Verify that OpenSSH / libcrypto can actually read the key
          if ! ssh-keygen -y -f "$HOME/.ssh/airguard_deploy" > "$HOME/.ssh/airguard_deploy.pub" 2>/dev/null; then
            echo "::error::SSH key could not be parsed by OpenSSH (libcrypto). Please re-check AZURE_DEPLOY_SSH_KEY in GitHub Secrets."
            exit 1
          fi

          echo "Derived public key (safe to view):"
          cat "$HOME/.ssh/airguard_deploy.pub"

          ssh-keyscan -t ed25519 -H "$AZURE_HOST" > "$HOME/.ssh/known_hosts.pending"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.pending" -E sha256 | awk '{print $2}')"
          test "$actual_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"
          mv "$HOME/.ssh/known_hosts.pending" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create verified Git deployment bundle
        run: |
          git branch --force airguard-deploy "$GITHUB_SHA"
          git bundle create "$RUNNER_TEMP/airguard.bundle" refs/heads/airguard-deploy
          git bundle verify "$RUNNER_TEMP/airguard.bundle"

      - name: Deploy through restricted forced command
        run: |
          ssh \
            -v \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/airguard_deploy" \
            "$AZURE_USER@$AZURE_HOST" \
            "deploy $GITHUB_SHA" < "$RUNNER_TEMP/airguard.bundle"

      - name: Verify public readiness
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 "$PUBLIC_READY_URL"
