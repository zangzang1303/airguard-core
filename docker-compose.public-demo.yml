# Persistent public-demo topology.  Do not expose the database, MQTT broker,
# backend, or agent ports directly to the Internet.
#
# Usage:
#   DEMO_DOMAIN=airguard.example.com docker compose -f docker-compose.public-demo.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
      POSTGRES_DB: airguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airguard -d airguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://airguard:${POSTGRES_PASSWORD}@postgres:5432/airguard
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DEMO_DOMAIN}}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-300}
      PM25_WARNING_THRESHOLD: ${PM25_WARNING_THRESHOLD:-50}
      PM25_CRITICAL_THRESHOLD: ${PM25_CRITICAL_THRESHOLD:-100}
      PM25_ALERT_RULE_VERSION: ${PM25_ALERT_RULE_VERSION:-pm25-threshold-v1}
      PM25_ALERT_CONSECUTIVE_MEASUREMENTS: ${PM25_ALERT_CONSECUTIVE_MEASUREMENTS:-2}
      ENVIRONMENT_ALERT_RULE_VERSION: ${ENVIRONMENT_ALERT_RULE_VERSION:-environmental-threshold-v1}
      AQI_WARNING_THRESHOLD: ${AQI_WARNING_THRESHOLD:-101}
      AQI_CRITICAL_THRESHOLD: ${AQI_CRITICAL_THRESHOLD:-151}
      CO2_WARNING_THRESHOLD: ${CO2_WARNING_THRESHOLD:-1000}
      CO2_CRITICAL_THRESHOLD: ${CO2_CRITICAL_THRESHOLD:-1500}
      NOISE_DB_WARNING_THRESHOLD: ${NOISE_DB_WARNING_THRESHOLD:-70}
      NOISE_DB_CRITICAL_THRESHOLD: ${NOISE_DB_CRITICAL_THRESHOLD:-85}
      TEMPERATURE_WARNING_THRESHOLD: ${TEMPERATURE_WARNING_THRESHOLD:-35}
      TEMPERATURE_CRITICAL_THRESHOLD: ${TEMPERATURE_CRITICAL_THRESHOLD:-39}
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_SERVICE_TIMEOUT_SECONDS: ${AGENT_SERVICE_TIMEOUT_SECONDS:-8}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: production
      APP_PORT: 8001
      AGENT_BACKEND_BASE_URL: http://backend:8000
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-3}
      AGENT_TOOL_MAX_RETRIES: ${AGENT_TOOL_MAX_RETRIES:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DEMO_DOMAIN}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-280}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /backend
    restart: unless-stopped

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_QOS: 1
      SENSOR_INTERVAL_SECONDS: ${SENSOR_INTERVAL_SECONDS:-10}
      SENSOR_SCENARIO: ${SENSOR_SCENARIO:-normal}
      SENSOR_RANDOM_SEED: ${SENSOR_RANDOM_SEED:-740}
      SENSOR_RUN_ID: ${SENSOR_RUN_ID:-}
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - mqtt

  mqtt-consumer:
    build:
      context: ./services/mqtt-consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://airguard:${POSTGRES_PASSWORD}@postgres:5432/airguard
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_QOS: 1
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-300}
      MAX_FUTURE_SKEW_SECONDS: ${MAX_FUTURE_SKEW_SECONDS:-60}
      BACKEND_URL: http://backend:8000
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      backend:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN to a DNS name pointing to this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
