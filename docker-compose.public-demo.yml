# Public topology: only Caddy exposes ports; all application services remain private.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
      POSTGRES_DB: airguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airguard -d airguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://airguard:${POSTGRES_PASSWORD}@postgres:5432/airguard
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DEMO_DOMAIN}}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      AGENT_SERVICE_URL: http://agent:8001
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: production
      APP_PORT: 8001
      AGENT_BACKEND_BASE_URL: http://backend:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DEMO_DOMAIN}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /backend
    restart: unless-stopped

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SENSOR_INTERVAL_SECONDS: ${SENSOR_INTERVAL_SECONDS:-10}
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - mqtt

  mqtt-consumer:
    build:
      context: ./services/mqtt-consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://airguard:${POSTGRES_PASSWORD}@postgres:5432/airguard
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      BACKEND_URL: http://backend:8000
      STATION_CATALOG_PATH: /app/data/stations.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      backend:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN to a DNS name pointing to this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
