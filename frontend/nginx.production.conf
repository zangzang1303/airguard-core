server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so SPA updates immediately across all clients
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Static assets have content hashes in their filename, so they can be cached long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
